[package]
name = "junior-display"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f407vg", "memory-x", "time-driver-any", "exti", "defmt", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-io-async = "0.7"
junior-protocol = { version = "0.1.0", path = "../protocol" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Standalone workspace: built for the STM32, not part of the Pi crate.
[workspace]

[profile.release]
debug = 2
lto = true
opt-level = "s"
